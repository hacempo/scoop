name: Hash Check

on:
  workflow_dispatch:
  schedule:
    # Check for upstream asset replacements even when the version is unchanged.
    - cron: '0 3 * * *'

permissions:
  contents: write

concurrency:
  group: hashcheck-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-hashes:
    name: Check and repair manifest hashes
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Scoop
        uses: ScoopInstaller/GithubActions@5bceeda181721d9d10a18fdcc3ddca6f33467ae6 # v3.0.0
        env:
          SKIP_UPDATED: 1

      - name: Check and update hashes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bucketDir = Join-Path $env:GITHUB_WORKSPACE 'bucket'
          $checkhashes = Join-Path $env:USERPROFILE 'SCOOP\apps\scoop\current\bin\checkhashes.ps1'

          if (-not (Test-Path -LiteralPath $checkhashes -PathType Leaf)) {
            throw "Scoop checkhashes script not found: $checkhashes"
          }

          $failures = [System.Collections.Generic.List[string]]::new()
          $manifests = Get-ChildItem -LiteralPath $bucketDir -Filter '*.json' -File | Sort-Object Name

          foreach ($manifest in $manifests) {
            Write-Host "::group::Hash check: $($manifest.BaseName)"
            $Error.Clear()
            try {
              & $checkhashes -App $manifest.BaseName -Dir $bucketDir -Update -SkipCorrect
              if ($Error.Count -gt 0) {
                throw "PowerShell reported an error while checking $($manifest.Name)."
              }
            }
            catch {
              $failures.Add("$($manifest.Name): $($_.Exception.Message)")
              Write-Host "::error::Hash check failed for $($manifest.Name): $($_.Exception.Message)"
            }
            finally {
              Write-Host "::endgroup::"
            }
          }

          "### Hash check results" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          "Checked $($manifests.Count) manifests." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ($failures.Count -gt 0) {
            $failures | ForEach-Object { "- $_" } | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            throw "$($failures.Count) manifest hash check(s) failed. See the summary above."
          }

      - name: Commit hash repairs
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- bucket
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Fix manifest hashes"
            if ($LASTEXITCODE -ne 0) { throw "Failed to commit hash repairs." }
            git push
            if ($LASTEXITCODE -ne 0) { throw "Failed to push hash repairs." }
          } else {
            Write-Host "All manifest hashes are up to date."
          }
